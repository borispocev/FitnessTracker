apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitnesstracker-ingress
  namespace: fitnesstracker
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: fitnesstracker.local
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: fitnesstracker-web
                port:
                  number: 80
          - path: /api/(.*)
            pathType: Prefix
            backend:
              service:
                name: fitnesstracker-api
                port:
                  number: 8080
