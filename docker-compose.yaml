services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fitness_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - fitness_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: src/FitnessTracker.Api/Dockerfile
    container_name: fitness_api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=FitnessTrackerDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  web:
    build:
      context: .
      dockerfile: src/FitnessTracker.Web/Dockerfile
    container_name: fitness_web
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=FitnessTrackerDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  fitness_db_data:
